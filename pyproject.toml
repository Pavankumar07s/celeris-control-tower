[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "celeris"
version = "0.1.0"
description = "Celeris Automobili Industrial: ERP extract cleaning, anomaly analysis, demand forecasting and planning control tower."
readme = "docs/architecture.md"
requires-python = ">=3.12,<3.13"
# Ranges compatible with the versions the outputs were built with; requirements.lock.txt pins those exact versions
# (README, "Exact reproduction"). Only packages that src/ or tests/ import, plus statsmodels, which statsforecast needs.
dependencies = [
    "pandas>=3.1,<3.2",
    "numpy>=2.5,<2.6",
    "pyarrow>=26.0,<27",
    "scipy>=1.18,<1.19",
    "statsmodels>=0.15,<0.16",
    "lightgbm>=4.7,<4.8",
    "statsforecast>=2.0,<2.1",
]

[project.optional-dependencies]
test = ["pytest>=9.2,<10"]

[project.scripts]
celeris = "celeris.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/celeris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "pipeline: runs the full part-A cleaning stage once per session (about 15 s)",
    "slow: end-to-end run of every stage (python -m celeris all twice, about 24 min, peak about 4 GB); deselected by default, run with make test-all",
]
filterwarnings = ["error::FutureWarning"]
